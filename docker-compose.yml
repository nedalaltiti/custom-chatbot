networks:
  hrbot-network:
    driver: bridge
    name: hrbot-network

volumes:
  hrbot-data:
    name: hrbot-data
  postgres-data:
    name: hrbot-postgres-data
  hrbot-logs-jo:
    name: hrbot-logs-jo
  hrbot-logs-us:
    name: hrbot-logs-us

services:
  
  # Jordan (jo) Instance
  hrbot-jo:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_INSTANCE: jo
    
    image: hrbot:jo-latest
    container_name: hrbot-jo
    restart: unless-stopped
    
    ports:
      - "3978:3978"
    
    # env_file:
    #   - .env.jo
    
    environment:
      - APP_INSTANCE=jo
      - HOSTNAME=hrbot-jo
      - PYTHONPATH=/app/src
      - HOST=0.0.0.0
      - PORT=3978
      # AWS credentials and configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-west-1}
      # Let .env.jo file handle AWS secret names
      - AWS_DB_SECRET_NAME=${AWS_DB_SECRET_NAME:-chatbot-clarity-db-dev-postgres}
      - AWS_GEMINI_SECRET_NAME=${AWS_GEMINI_SECRET_NAME:-genai-gemini-vertex-prod-api}
      # Local development overrides
      - USE_AWS_SECRETS=${USE_AWS_SECRETS:-true}
      - SKIP_DB_INIT=${SKIP_DB_INIT:-false}
    
    volumes:
      - hrbot-data:/app/data
      - hrbot-logs-jo:/app/logs
    
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=hrbot-jo,environment=${DEBUG:-production}"
    
    networks:
      - hrbot-network
    
    security_opt:
      - no-new-privileges:true
    
    profiles:
      - jo
      - multi-app
      - development
      - default

  # US Instance
  hrbot-us:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_INSTANCE: us
    
    image: hrbot:us-latest
    container_name: hrbot-us
    restart: unless-stopped
    
    ports:
      - "3979:3979"
    
    # env_file:
    #   - .env.us
    
    environment:
      - APP_INSTANCE=us
      - HOSTNAME=hrbot-us
      - PYTHONPATH=/app/src
      - HOST=0.0.0.0
      - PORT=3979
      # AWS credentials and configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-west-1}
      # Let .env.us file handle AWS secret names
      - AWS_DB_SECRET_NAME=${AWS_DB_SECRET_NAME:-chatbot-clarity-db-dev-postgres}
      - AWS_GEMINI_SECRET_NAME=${AWS_GEMINI_SECRET_NAME:-genai-gemini-vertex-prod-api}
      # Local development overrides
      - USE_AWS_SECRETS=${USE_AWS_SECRETS:-true}
      - SKIP_DB_INIT=${SKIP_DB_INIT:-false}
    
    volumes:
      - hrbot-data:/app/data
      - hrbot-logs-us:/app/logs
    
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=hrbot-us,environment=${DEBUG:-production}"
    
    networks:
      - hrbot-network
    
    security_opt:
      - no-new-privileges:true
    
    profiles:
      - us
      - multi-app
      - development

  # UWBot Instance
  uwbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_USER: uwbot
    
    image: uwbot:latest
    container_name: uwbot
    restart: unless-stopped
    
    ports:
      - "3980:3980"
    
    environment:
      - APP_TYPE=uwbot
      - HOSTNAME=uwbot
      - PYTHONPATH=/app/src
      - HOST=0.0.0.0
      - PORT=3980
      # AWS credentials and configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-west-1}
      - AWS_DB_SECRET_NAME=${UWBOT_AWS_DB_SECRET_NAME:-chatbot-clarity-db-dev-postgres}
      - USE_AWS_SECRETS=${USE_AWS_SECRETS:-true}
      - SKIP_DB_INIT=${SKIP_DB_INIT:-false}
    
    volumes:
      - hrbot-data:/app/data
      - hrbot-logs-us:/app/logs
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3980/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=uwbot,environment=${DEBUG:-production}"
    
    networks:
      - hrbot-network
    
    security_opt:
      - no-new-privileges:true
    
    profiles:
      - uwbot
      - multi-app
      - development

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: hrbot-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    
    depends_on:
      - hrbot-jo
      - hrbot-us
    
    networks:
      - hrbot-network
    
    profiles:
      - multi-app
      - production